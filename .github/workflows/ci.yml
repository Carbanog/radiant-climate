name: Verify development candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0 ruff==0.14.4
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_public_content.py
      - run: python scripts/check_metadata.py
      - run: python -m pytest tests/test_control.py tests/test_program.py tests/test_intelligence.py tests/test_hydraulic.py -q
  homeassistant:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==${{ matrix.ha }} pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest tests/test_homeassistant.py -q
      - name: Package exact development commit
        run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radiant-climate-${{ matrix.ha }}-${{ github.sha }}
          path: dist/*
          retention-days: 14

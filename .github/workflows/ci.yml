name: Verify development candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0 ruff==0.14.4
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_public_content.py
      - run: python -m pytest tests/test_control.py tests/test_program.py -q
  homeassistant:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.4 pytest==8.4.2 pytest-asyncio==1.2.0
      - run: python -m pytest tests/test_homeassistant.py -q
      - name: Package exact development commit
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: radiant-climate-${{ github.sha }}
          path: dist/*
          retention-days: 14

name: Validate integration metadata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

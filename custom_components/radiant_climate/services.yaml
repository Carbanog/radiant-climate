copy_settings:
  fields:
    source:
      required: true
      selector:
        entity:
          domain: climate
          integration: radiant_climate
    targets:
      selector:
        entity:
          domain: climate
          integration: radiant_climate
          multiple: true
    parts:
      required: true
      selector:
        select:
          multiple: true
          translation_key: copy_parts
          options:
            - temperatures
            - manual
            - schedule
            - modules
            - vacation
reset_actuator_faults:
  fields:
    actuators:
      selector:
        entity:
          domain: switch
          multiple: true
    confirmed_review:
      required: true
      selector:
        boolean:
acknowledge_retired_actuator:
  fields:
    actuator:
      required: true
      selector:
        text:
    confirmed_disconnected:
      required: true
      selector:
        boolean:
